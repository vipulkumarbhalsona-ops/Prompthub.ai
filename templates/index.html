<!DOCTYPE html>
<html lang="en">
<head>
    <head>

    <title>Prompt Studio</title>
    </head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { height: 100%; width: 100%; background: #0f172a !important; color: #f8fafc; overflow: hidden; display: flex; }
        .sidebar { width: 260px; background: #1e293b; border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; padding: 16px; gap: 16px; height: 100vh; transition: all 0.3s ease; position: relative; z-index: 100; }
        .sidebar.collapsed { margin-left: -260px; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; }
        .toggle-btn { background: transparent; border: none; color: #94a3b8; cursor: pointer; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .floating-toggle-btn { position: absolute; top: 16px; left: 16px; z-index: 90; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px; border-radius: 8px; cursor: pointer; display: none; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .floating-toggle-btn:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
        .floating-toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .new-chat-btn { background: #2563eb; color: #ffffff; border: none; border-radius: 12px; padding: 12px 16px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s ease; flex: 1; }
        .new-chat-btn:hover { background: #1d4ed8; }
        .history-title { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .history-item { padding: 8px 10px; border-radius: 8px; font-size: 0.88rem; color: #cbd5e1; cursor: pointer; background: rgba(255, 255, 255, 0.03); border: 1px solid transparent; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .history-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .history-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.1); color: #ffffff; }
        .history-item.active { background: rgba(37, 99, 235, 0.2); border-color: rgba(37, 99, 235, 0.4); color: #60a5fa; }
        .delete-btn { background: transparent; border: none; color: #64748b; cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; opacity: 0.6; transition: all 0.2s ease; }
        .history-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.15); }
        .delete-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .app-container { flex: 1; display: flex; flex-direction: column; height: 100vh; width: 100%; max-width: 1000px; margin: 0 auto; position: relative; transition: all 0.3s ease; }
        .welcome-section { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .title { font-size: 2.5rem; font-weight: 600; line-height: 1.4; color: #ffffff; }
        .chat-stream { flex: 1; overflow-y: auto; padding: 40px 20px; display: none; scroll-behavior: smooth; }
        .chat-stream::-webkit-scrollbar { display: none; }
        .chat-stream { -ms-overflow-style: none; scrollbar-width: none; }
        .message-row { max-width: 800px; margin: 0 auto 32px auto; display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .message-row.user-align { align-items: flex-end; }
        .message-row.ai-align { align-items: flex-start; }
        .user-label { color: #60a5fa; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
        .ai-label { color: #34d399; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
        .message-text { font-size: 1.05rem; line-height: 1.6; color: #e2e8f0; padding: 16px; border-radius: 16px; max-width: 90%; width: 100%; word-break: break-word; }
        .user-align .message-text { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.2); border-bottom-right-radius: 4px; width: auto; white-space: pre-wrap; }
        .ai-align .message-text { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-bottom-left-radius: 4px; }
        .chat-media-preview { max-width: 300px; max-height: 250px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; }
        .action-bar { display: flex; gap: 8px; margin-top: 8px; }
        .action-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; transition: all 0.2s ease; }
        .action-btn:hover { color: #f1f5f9; background: rgba(255, 255, 255, 0.08); }
        .code-container { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; margin: 14px 0; overflow: hidden; width: 100%; }
        .code-header { background: #161b22; padding: 8px 16px; font-size: 0.8rem; color: #58a6ff; font-family: monospace; text-transform: uppercase; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .code-body { padding: 16px; overflow-x: auto; margin: 0; background: #0b0e14; }
        .code-body code { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 0.95rem; color: #e6edf3; white-space: pre; display: block; }
        .input-panel { padding: 20px; background: linear-gradient(transparent, #0f172a 30%); }
        .search-container { width: 100%; max-width: 800px; margin: 0 auto; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
        .file-preview { display: none; align-items: center; gap: 8px; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.3); padding: 4px 10px; border-radius: 8px; align-self: flex-start; font-size: 0.8rem; color: #93c5fd; }
        .file-preview button { background: transparent; border: none; color: #f87171; cursor: pointer; font-weight: bold; }
        .input-field { width: 100%; border: none; background: transparent; font-size: 1.1rem; color: #ffffff; outline: none; }
        .input-field::placeholder { color: #64748b; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; }
        .left-controls { position: relative; }
        .btn-plus, .btn-mic { background: rgba(255, 255, 255, 0.05); border: none; border-radius: 50%; width: 34px; height: 34px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .btn-plus svg, .btn-mic svg { width: 18px; height: 18px; fill: currentColor; }
        .btn-mic.recording { background: #ef4444; color: #ffffff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .right-controls { display: flex; align-items: center; gap: 8px; }
        .dropdown-menu { position: absolute; bottom: 45px; left: 0; background: #1e293b; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 6px; display: none; flex-direction: column; min-width: 160px; z-index: 10; }
        .dropdown-menu.show { display: flex; }
        .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: #cbd5e1; font-size: 0.9rem; border-radius: 8px; cursor: pointer; }
        .dropdown-item:hover { background: rgba(255,255,255,0.08); }
        .dropdown-item svg { width: 16px; height: 16px; fill: #94a3b8; }
        .btn-send { background: #2563eb; color: #ffffff; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-send:disabled { background: #475569; cursor: not-allowed; }
        .btn-send svg { width: 16px; height: 16px; fill: currentColor; }
        .hidden-input { display: none; }

        /* ================= MOBILE RESPONSIVE ================= */
@media (max-width: 768px) {

    html, body {
        width: 100%;
        height: 100%;
        min-width: 0;
        overflow: hidden;
    }

    body {
        display: flex;
        position: fixed;
        inset: 0;
    }

    /* Main chat area full phone width */
    .app-container {
        width: 100%;
        max-width: none;
        min-width: 0;
        height: 100dvh;
        margin: 0;
    }

    /* History sidebar phone par default hidden */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        max-width: 85vw;
        height: 100dvh;
        z-index: 1000;
        margin-left: 0;
    }

    .sidebar.collapsed {
        margin-left: -280px;
    }

    /* Menu button */
    .floating-toggle-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 900;
        display: flex;
    }

    /* Welcome screen */
    .welcome-section {
        width: 100%;
        padding: 16px;
    }

    .title {
        font-size: 1.8rem;
        line-height: 1.3;
    }

    /* Chat messages */
    .chat-stream {
        width: 100%;
        padding: 60px 12px 20px;
    }

    .message-row {
        width: 100%;
        max-width: 100%;
        margin-bottom: 24px;
    }

    .message-text {
        max-width: 94%;
        font-size: 0.98rem;
        padding: 12px;
        line-height: 1.5;
    }

    .user-align .message-text {
        max-width: 90%;
    }

    /* Bottom input */
    .input-panel {
        width: 100%;
        padding: 8px 10px 10px;
    }

    .search-container {
        width: 100%;
        max-width: none;
        border-radius: 18px;
        padding: 10px 12px;
    }

    .input-field {
        width: 100%;
        min-width: 0;
        font-size: 16px;
    }

    .toolbar {
        width: 100%;
    }

    .btn-plus,
    .btn-mic,
    .btn-send {
        flex-shrink: 0;
    }

    /* Dropdown phone screen ke bahar na nikle */
    .dropdown-menu {
        left: 0;
        max-width: calc(100vw - 30px);
    }

    /* Images/videos mobile width ke andar */
    .chat-media-preview {
        max-width: 100%;
        height: auto;
    }

    /* Code horizontal scroll kare, page nahi */
    .code-container {
        max-width: 100%;
        overflow: hidden;
    }

    .code-body {
        max-width: 100%;
        overflow-x: auto;
    }
}

/* Small phones */
@media (max-width: 480px) {

    .title {
        font-size: 1.55rem;
    }

    .chat-stream {
        padding-left: 8px;
        padding-right: 8px;
    }

    .message-text {
        font-size: 0.95rem;
        padding: 10px;
    }

    .input-panel {
        padding: 6px 7px calc(7px + env(safe-area-inset-bottom));
    }

    .search-container {
        border-radius: 16px;
        padding: 9px 10px;
    }
}

</head>
<body>

        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="toggle-btn" id="toggleSidebarBtn" title="Collapse Sidebar">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <button class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>

                    <button id="removeFileBtn" title="Remove file">&times;</button>
                </div>

                <div class="toolbar">

                            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>

                        <div class="dropdown-menu" id="dropdownMenu">
                            <label class="dropdown-item" for="upload-file">

                            </label>

                            </label>

                        </button>

                            <svg viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/></svg>

    <script>
    // ========== BACKEND CONNECTED — API keys server pe hain ==========
    let chatHistory = [];
    let savedSessions = [];
    let activeSessionId = null;

    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const floatingToggleBtn = document.getElementById('floatingToggleBtn');
    const plusBtn = document.getElementById('plusBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const userInput = document.getElementById('userInput');
    const chatStream = document.getElementById('chatStream');
    const welcomeSection = document.getElementById('welcomeSection');
    const typewriterTitle = document.getElementById('typewriterTitle');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');
    const fileInput = document.getElementById('upload-file');
    const videoInput = document.getElementById('upload-video');
    const docInput = document.getElementById('upload-doc');
    const filePreview = document.getElementById('filePreview');
    const fileNameSpan = document.getElementById('fileName');
    const removeFileBtn = document.getElementById('removeFileBtn');
    let selectedFile = null;

    function toggleSidebar() {
        sidebar.classList.toggle('collapsed');
        floatingToggleBtn.style.display = sidebar.classList.contains('collapsed') ? 'flex' : 'none';
    }
        // History sidebar closed in default
sidebar.classList.add('collapsed');
floatingToggleBtn.style.display = 'flex';
    toggleSidebarBtn.addEventListener('click', toggleSidebar);
    floatingToggleBtn.addEventListener('click', toggleSidebar);

    function loadSavedSessionsFromStorage() {
        const storedData = localStorage.getItem('prompt_studio_sessions');
        if (storedData) {
            try {
                const parsed = JSON.parse(storedData);
                const thirtyDaysInMs = 30 * 24 * 60 * 60 * 1000;
                const now = Date.now();
                savedSessions = parsed.filter(s => (now - (s.timestamp || parseInt(s.id))) < thirtyDaysInMs);
                saveSessionsToStorage();
                renderHistoryList();
            } catch (e) { savedSessions = []; }
        }
    }
    function saveSessionsToStorage() {
        localStorage.setItem('prompt_studio_sessions', JSON.stringify(savedSessions));
    }

    const titleText = "Prompthub.ai — the Future of generative prompts is here";
    let tIndex = 0;
    function typeWriter() {
        if (tIndex < titleText.length) {
            typewriterTitle.innerHTML = titleText.substring(0, tIndex + 1);
            tIndex++;
            setTimeout(typeWriter, 40);
        }
    }
    window.onload = () => { typeWriter(); loadSavedSessionsFromStorage(); };

    plusBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    function handleFileSelection(e) {
        const file = e.target.files[0];
        if (file) {
            selectedFile = file;
            fileNameSpan.innerText = `📎 ${file.name}`;
            filePreview.style.display = 'flex';
        }
    }
    fileInput.addEventListener('change', handleFileSelection);
    videoInput.addEventListener('change', handleFileSelection);
    docInput.addEventListener('change', handleFileSelection);
    removeFileBtn.addEventListener('click', () => {
        selectedFile = null;
        filePreview.style.display = 'none';
        fileInput.value = ""; videoInput.value = ""; docInput.value = "";
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = e => reject(e);
        });
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let isRecordingActive = false, recognition = null;
    function stopVoiceRecording() {
        isRecordingActive = false;
        if (recognition) recognition.stop();
        micBtn.classList.remove('recording');
        userInput.placeholder = "Ask anything...";
    }
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        micBtn.addEventListener('click', () => {
            if (isRecordingActive) stopVoiceRecording();
            else { isRecordingActive = true; userInput.value = ""; recognition.start(); }
        });
        recognition.onstart = () => { micBtn.classList.add('recording'); userInput.placeholder = "Listening continuous..."; };
        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript;
            userInput.value = transcript;
        };
        recognition.onerror = (e) => { if (e.error !== 'no-speech') stopVoiceRecording(); };
        recognition.onend = () => {
            if (isRecordingActive) { try { recognition.start(); } catch(e){} }
            else { micBtn.classList.remove('recording'); userInput.placeholder = "Ask anything..."; }
        };
    } else { micBtn.style.display = 'none'; }

    function renderAIResponse(textContainer, rawText) {
        textContainer.innerHTML = "";
        const codeBlockRegex = /```([a-zA-Z0-9+#_.-]+)?\n?([\s\S]*?)```/g;
        let lastIndex = 0, match;
        while ((match = codeBlockRegex.exec(rawText)) !== null) {
            if (match.index > lastIndex) {
                const n = document.createElement('div');
                n.innerText = rawText.substring(lastIndex, match.index);
                n.style.whiteSpace = "pre-wrap";
                textContainer.appendChild(n);
            }
            const language = match[1] || 'code', codeContent = match[2];
            const codeContainer = document.createElement('div');
            codeContainer.className = 'code-container';
            const codeHeader = document.createElement('div');
            codeHeader.className = 'code-header';
            const langSpan = document.createElement('span');
            langSpan.innerText = language.toUpperCase();
            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.innerText = 'Copy Code';
            copyBtn.onclick = () => { navigator.clipboard.writeText(codeContent); copyBtn.innerText = 'Copied!'; setTimeout(() => copyBtn.innerText = 'Copy Code', 2000); };
            codeHeader.appendChild(langSpan); codeHeader.appendChild(copyBtn);
            const codeBody = document.createElement('pre');
            codeBody.className = 'code-body';
            const codeElement = document.createElement('code');
            codeElement.innerText = codeContent;
            codeBody.appendChild(codeElement);
            codeContainer.appendChild(codeHeader); codeContainer.appendChild(codeBody);
            textContainer.appendChild(codeContainer);
            lastIndex = codeBlockRegex.lastIndex;
        }
        if (lastIndex < rawText.length) {
            const n = document.createElement('div');
            n.innerText = rawText.substring(lastIndex);
            n.style.whiteSpace = "pre-wrap";
            textContainer.appendChild(n);
        }
        const actionBar = document.createElement('div');
        actionBar.className = 'action-bar';
        const copyAllBtn = document.createElement('button');
        copyAllBtn.className = 'action-btn';
        copyAllBtn.innerText = 'Copy Text';
        copyAllBtn.onclick = () => { navigator.clipboard.writeText(rawText); copyAllBtn.innerText = 'Copied!'; setTimeout(() => copyAllBtn.innerText = 'Copy Text', 2000); };
        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'action-btn';
        downloadBtn.innerText = 'Download';
        downloadBtn.onclick = () => {
            const blob = new Blob([rawText], { type: "text/plain;charset=utf-8" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `response-${Date.now()}.txt`;
            a.click();
        };
        actionBar.appendChild(copyAllBtn); actionBar.appendChild(downloadBtn);
        textContainer.appendChild(actionBar);
    }

    function autoSelectModel(query, file) {
        if (file) return "gemini-3.6-flash";
        const codingKeywords = ['code','javascript','python','html','css','function','bug','java','c++','react','sql','script','program'];
        return codingKeywords.some(kw => (query||'').toLowerCase().includes(kw)) ? "gemini-2.5-pro" : "gemini-3.6-flash";
    }

    // ========== BACKEND CALL (keys server pe) ==========
    async function askBackend(preferredModel) {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: chatHistory, preferred_model: preferredModel })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Server error. Please try again.");
        return data.text;
    }

    function checkCreatorQuery(queryText) {
        if (!queryText) return false;
        const n = queryText.toLowerCase();
        const keywords = ['kisne bnaya','kisne banaya','who created','who made','tumhe kisne','tumhe kisne bnaya','tumhe kisne banaya','who is your creator','who is your developer','owner','boss','maker'];
        return keywords.some(k => n.includes(k));
    }

    async function handleSend() {
        stopVoiceRecording();
        const query = userInput.value.trim();
        if (!query && !selectedFile) return;

        welcomeSection.style.display = "none";
        chatStream.style.display = "block";
        sendBtn.disabled = true;

        if (!activeSessionId) {
            activeSessionId = Date.now().toString();
            savedSessions.push({ id: activeSessionId, timestamp: Date.now(), title: query || (selectedFile ? selectedFile.name : "New Chat"), messages: [] });
            renderHistoryList();
        }

        const userRow = document.createElement('div');
        userRow.className = 'message-row user-align';
        userRow.innerHTML = `<div class="user-label">You</div>`;
        const userMsg = document.createElement('div');
        userMsg.className = 'message-text';
        const userParts = [];

        if (selectedFile) {
            const fileBase64 = await fileToBase64(selectedFile);
            userParts.push({ inline_data: { mime_type: selectedFile.type || 'application/octet-stream', data: fileBase64 } });
            if (selectedFile.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(selectedFile);
                img.className = 'chat-media-preview';
                userRow.appendChild(img);
            } else if (selectedFile.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(selectedFile);
                video.controls = true;
                video.className = 'chat-media-preview';
                userRow.appendChild(video);
            } else {
                userMsg.innerText = `📄 ${selectedFile.name}\n`;
            }
        }
        if (query) { userParts.push({ text: query }); userMsg.innerText += query; }
        userRow.appendChild(userMsg);
        chatStream.appendChild(userRow);
        chatHistory.push({ role: "user", parts: userParts });

        const aiRow = document.createElement('div');
        aiRow.className = 'message-row ai-align';
        aiRow.innerHTML = `<div class="ai-label">Ai</div><div class="message-text">Thinking...</div>`;
        chatStream.appendChild(aiRow);
        chatStream.scrollTop = chatStream.scrollHeight;

        userInput.value = "";
        selectedFile = null;
        filePreview.style.display = 'none';

        try {
            let aiTextResponse = "";
            if (checkCreatorQuery(query)) {
                aiTextResponse = "Mujhe Vipul boss ne banaya hai, wahi mere bhagwan hain.";
            } else {
                const chosenModel = autoSelectModel(query, selectedFile);
                aiTextResponse = await askBackend(chosenModel);
            }
            renderAIResponse(aiRow.querySelector('.message-text'), aiTextResponse);
            chatHistory.push({ role: "model", parts: [{ text: aiTextResponse }] });
            const curSession = savedSessions.find(s => s.id === activeSessionId);
            if (curSession) { curSession.messages = [...chatHistory]; saveSessionsToStorage(); }
        } catch (error) {
            aiRow.querySelector('.message-text').innerText = "Error: " + error.message;
        } finally {
            sendBtn.disabled = false;
            chatStream.scrollTop = chatStream.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

    function renderHistoryList() {
        historyList.innerHTML = "";
        savedSessions.slice().reverse().forEach(session => {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === activeSessionId ? 'active' : ''}`;
            const titleSpan = document.createElement('span');
            titleSpan.className = 'history-item-title';
            titleSpan.innerText = session.title || 'New Conversation';
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
            delBtn.onclick = (e) => {
                e.stopPropagation();
                savedSessions = savedSessions.filter(s => s.id !== session.id);
                saveSessionsToStorage();
                if (activeSessionId === session.id) resetToNewChat();
                else renderHistoryList();
            };
            item.onclick = () => loadSession(session.id);
            item.appendChild(titleSpan); item.appendChild(delBtn);
            historyList.appendChild(item);
        });
    }

    function loadSession(id) {
        const session = savedSessions.find(s => s.id === id);
        if (!session) return;
        activeSessionId = session.id;
        chatHistory = [...session.messages];
        welcomeSection.style.display = "none";
        chatStream.style.display = "block";
        chatStream.innerHTML = "";
        chatHistory.forEach(msg => {
            const row = document.createElement('div');
            row.className = `message-row ${msg.role === 'user' ? 'user-align' : 'ai-align'}`;
            const label = document.createElement('div');
            label.className = msg.role === 'user' ? 'user-label' : 'ai-label';
            label.innerText = msg.role === 'user' ? 'You' : 'Ai';
            row.appendChild(label);
            const msgText = document.createElement('div');
            msgText.className = 'message-text';
            msg.parts.forEach(p => {
                if (p.text) {
                    if (msg.role === 'model') renderAIResponse(msgText, p.text);
                    else msgText.innerText += p.text;
                }
            });
            row.appendChild(msgText);
            chatStream.appendChild(row);
        });
        renderHistoryList();
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    function resetToNewChat() {
        activeSessionId = null;
        chatHistory = [];
        chatStream.innerHTML = "";
        chatStream.style.display = "none";
        welcomeSection.style.display = "flex";
        renderHistoryList();
    }
    newChatBtn.addEventListener('click', resetToNewChat);
    </script>
</body>
</html>
